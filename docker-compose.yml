services:
  postgres:
    # pgvector/pgvector ships the stock postgres:17 image plus the `vector` extension,
    # which the semantic roster search (RAG) feature enables via migration.
    image: pgvector/pgvector:pg17
    container_name: cvmanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvmanager
    ports:
      - "5432:5432"
    volumes:
      - cvmanager-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cvmanager-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Local observability (P1T-94): traces/metrics/logs UI at http://localhost:18888; both .NET
  # services export OTLP to :4317 by default. In-memory — history clears with the container.
  # The app runs unchanged when this service is down.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: cvmanager-aspire
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # dashboard UI
      - "4317:18889"  # OTLP gRPC ingest

volumes:
  cvmanager-pgdata:
