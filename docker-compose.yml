services:
  postgres:
    image: postgres:17
    container_name: employeemanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employeemanager
    ports:
      - "5432:5432"
    volumes:
      - employeemanager-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employeemanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  employeemanager-pgdata:
