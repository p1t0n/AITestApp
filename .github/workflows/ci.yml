name: CI

# Runs on every pull request (any base branch) and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CvManager.slnx

      - name: Build
        run: dotnet build CvManager.slnx --configuration Release --no-restore

      - name: Test
        # Docker is preinstalled on ubuntu-latest runners; the MCP e2e suite
        # spins up Keycloak via Testcontainers.
        run: dotnet test CvManager.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
