name: CI

# Runs on every pull request (any base branch) and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CvManager.slnx

      - name: Build
        run: dotnet build CvManager.slnx --configuration Release --no-restore

      - name: Test
        # Docker is preinstalled on ubuntu-latest runners; the MCP e2e suite
        # spins up Keycloak via Testcontainers.
        run: dotnet test CvManager.slnx --configuration Release --no-build --verbosity normal
