name: CI

# Runs on every pull request (any base branch) and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore ExpertToJob.slnx

      - name: Build
        run: dotnet build ExpertToJob.slnx --configuration Release --no-restore

      - name: Test
        # Docker is preinstalled on ubuntu-latest runners; the MCP e2e suite
        # spins up Keycloak via Testcontainers.
        run: dotnet test ExpertToJob.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  infra:
    name: Infra (bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The path filter below diffs against the pull request's base, which a shallow clone
          # cannot do.
          fetch-depth: 0

      - name: Did anything under infra/ change?
        id: filter
        # GitHub has no per-job `paths:` filter, and putting one on the workflow would filter all
        # four jobs. So the job decides for itself and skips its own steps. A push to main always
        # runs it, so main never sits on an unchecked template.
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^infra/'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'nothing under infra/ changed'
          fi

      - name: Install Bicep
        if: steps.filter.outputs.run == 'true'
        # Pinned: `az bicep build` otherwise pulls whatever is newest, and a new compiler release
        # can add a warning — which this job treats as a failure — to a template nobody touched.
        # The Azure CLI itself is preinstalled on ubuntu-latest runners.
        run: az bicep install --version v0.47.16

      - name: Check the base deployment
        if: steps.filter.outputs.run == 'true'
        # Compiles base.bicep and base.bicepparam with the linter and reads the non-negotiables
        # back out of the ARM JSON. No Azure credentials: nothing here talks to Azure.
        run: ./infra/base.test.sh

      - name: Check the apps deployment
        if: steps.filter.outputs.run == 'true'
        # Same shape for apps.bicep: the edge lockdown, the five apps, the migrator job, and the
        # rule that no secret ever rides as a plain env value. Also no Azure credentials.
        run: ./infra/apps.test.sh

  images:
    name: Images (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the five deployable images
        # Build only — no registry, no push. The deploy workflow is what tags and pushes these
        # (EXP-122); this job exists so a Dockerfile that stopped building is a red PR rather
        # than a red deploy. Docker is preinstalled on ubuntu-latest runners.
        run: |
          for name in web mcp agents migrator edge; do
            echo "::group::$name"
            docker build -f "deploy/images/$name.Dockerfile" -t "etj-$name:ci" .
            echo "::endgroup::"
          done

      - name: Check the image definitions
        run: ./deploy/images/dockerfiles.test.sh

      - name: Check the edge's nginx config
        # Renders the template through the nginx image's own envsubst step and runs nginx -t on
        # the result, so a config that only greps right still fails here.
        run: ./deploy/images/nginx-conf.test.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install SPA dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        # Chromium only: the passkey ceremonies need the CDP virtual authenticator.
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build the Web API and the migrator
        # The e2e runner starts both with `dotnet run` — the migrator first, then the API; building
        # here keeps those starts fast and surfaces a build break as a build break.
        run: |
          dotnet build api/Migrator/ExpertToJob.Migrator.csproj --configuration Debug
          dotnet build api/Web/ExpertToJob.Web.csproj --configuration Debug

      - name: Run e2e
        # Owns its stack: a throwaway pgvector container (Docker is preinstalled on the runner),
        # the Web API, and the SPA.
        run: npm run test:e2e
        working-directory: web

      - name: Run the visual net
        # Renders in the pinned Playwright container rather than in the runner's own Chromium, so
        # the committed baselines mean the same thing here as on the machine that produced them
        # (`web/e2e/run.mjs` explains the whole arrangement). Docker is preinstalled on the runner.
        run: npm run test:visual
        working-directory: web

      - name: Upload traces and visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          # `test-results/` carries the trace zips and, for a failed baseline, the expected/actual
          # /diff triptych — which is the only useful way to review a visual failure.
          path: web/test-results/
          retention-days: 7
