name: CI

# Runs on every pull request (any base branch) and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ExpertToJob.slnx

      - name: Build
        run: dotnet build ExpertToJob.slnx --configuration Release --no-restore

      - name: Test
        # Docker is preinstalled on ubuntu-latest runners; the MCP e2e suite
        # spins up Keycloak via Testcontainers.
        run: dotnet test ExpertToJob.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install SPA dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        # Chromium only: the passkey ceremonies need the CDP virtual authenticator.
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build the Web API
        # The e2e runner starts the API with `dotnet run`; building here keeps that start fast
        # and surfaces a build break as a build break.
        run: dotnet build api/Web/ExpertToJob.Web.csproj --configuration Debug

      - name: Run e2e
        # Owns its stack: a throwaway pgvector container (Docker is preinstalled on the runner),
        # the Web API, and the SPA.
        run: npm run test:e2e
        working-directory: web

      - name: Run the visual net
        # Renders in the pinned Playwright container rather than in the runner's own Chromium, so
        # the committed baselines mean the same thing here as on the machine that produced them
        # (`web/e2e/run.mjs` explains the whole arrangement). Docker is preinstalled on the runner.
        run: npm run test:visual
        working-directory: web

      - name: Upload traces and visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # `test-results/` carries the trace zips and, for a failed baseline, the expected/actual
          # /diff triptych — which is the only useful way to review a visual failure.
          path: web/test-results/
          retention-days: 7
